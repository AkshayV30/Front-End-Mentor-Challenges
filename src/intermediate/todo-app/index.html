<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Todo app</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="stylesheet" href="./res/css/base.css" />

    <!-- Theme -->
    <link rel="stylesheet" href="./res/css/dark-theme.css" id="themeStylesheet" />
  </head>
  <body class="theme-dark">
    <header class="hero">
      <img
        src="./images/bg-desktop-dark.jpg"
        alt="Background"
        class="hero__image"
        id="heroImage"
      />
    </header>
    <main class="container">
      <section class="todo" aria-label="Todo application">
        <header class="todo__header">
          <h1 class="todo__title">TODO</h1>
          <button
            id="themeToggle"
            class="todo__theme-btn"
            type="button"
            aria-label="Switch to light theme"
          >
            <img src="./images/icon-sun.svg" alt="" id="themeIcon" />
          </button>
        </header>
        <!--  -->
        <div class="todo__input-wrapper">
          <input
            id="taskInput"
            class="todo__input"
            type="text"
            placeholder="Create a new task"
            maxlength="100"
            autocomplete="off"
          />
        </div>

        <!-- TODO LIST -->
        <div class="todo__list-wrapper">
          <ul id="taskList" class="todo__list" aria-live="polite"></ul>

          <!-- FOOTER -->
          <div class="todo__filters">
              <button
                type="button"
                data-filter="all"
                class="is-active"
              >
                All
              </button>

              <button
                type="button"
                data-filter="active"
              >
                Active
              </button>

              <button
                type="button"
                data-filter="completed"
              >
                Completed
              </button>
            </div>

            <button
              id="clearCompleted"
              class="todo__clear"
              type="button"
            >
              Clear Completed
            </button>
          </footer>
        </div>
        <p class="todo__hint">Drag and drop to reorder list</p>
      </section>
    </main>

    <footer>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="#">AkshayV30</a>.
      </div>
    </footer>

    <script src="./res/js/storage.js"></script>
    <script src="./res/js/todos.js"></script>
    <script src="./res/js/theme.js"></script>
    <script src="./res/js/app.js"></script>
  </body>
</html>
